<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administración de productos · Tienda Nube</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/theme.css" rel="stylesheet" />
  <script src="js/theme.js"></script>
</head>
<body>

  <!-- NAVBAR ADMIN — sin búsqueda ni carrito -->
  <nav class="navbar tn-nav navbar-expand-lg sticky-top py-2">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <span class="brand-mark"><i class="bi bi-cloud-fill"></i></span>
        Tienda<span class="text-primary">Nube</span>
        <span class="badge bg-soft-primary text-primary ms-2" style="font-size:.7rem;">Admin</span>
      </a>
      <div class="d-flex align-items-center gap-2">
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Cambiar tema">
          <i class="bi bi-moon-stars-fill" data-theme-icon></i>
        </button>
        <a class="btn btn-soft" href="productos.html">
          <i class="bi bi-grid me-1"></i>Ver catálogo
        </a>
        <a class="btn btn-soft" href="index.html">
          <i class="bi bi-house me-1"></i>Inicio
        </a>
        <button class="btn btn-outline-danger btn-sm" id="btnLogout" type="button">
          <i class="bi bi-box-arrow-right me-1"></i>Salir
        </button>
      </div>
    </div>
  </nav>

  <!-- ENCABEZADO -->
  <header class="page-head py-4">
    <div class="container py-2">
      <h1 class="h2 fw-bold mb-1">Administración de productos</h1>
      <p class="text-secondary mb-0">Registrá, editá y eliminá los productos de la tienda.</p>
    </div>
  </header>

  <div class="container py-5">
    <div class="row g-4 g-lg-5">

      <!-- ── FORMULARIO ─────────────────────────────────── -->
      <div class="col-lg-4">
        <div class="card border-0 shadow-soft p-4 position-sticky" style="top: 90px;">

          <h2 class="h5 fw-bold mb-1" id="formTitulo">Nuevo producto</h2>
          <p class="text-secondary small mb-4">Los campos con <span class="text-danger">*</span> son obligatorios.</p>

          <form id="formProducto" novalidate>
            <!-- id oculto para modo edición -->
            <input type="hidden" id="productoId" value="" />

            <div class="mb-3">
              <label class="form-label" for="pNombre">Nombre <span class="text-danger">*</span></label>
              <input id="pNombre" class="form-control" placeholder="Ej: Smartphone Aurora 5G" required />
            </div>

            <div class="mb-3">
              <label class="form-label" for="pDescripcion">Descripción</label>
              <textarea id="pDescripcion" class="form-control" rows="3"
                placeholder="Descripción breve del producto"></textarea>
            </div>

            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label" for="pPrecio">Precio <span class="text-danger">*</span></label>
                <input id="pPrecio" type="number" min="0" step="0.01"
                  class="form-control" placeholder="0.00" required />
              </div>
              <div class="col-6">
                <label class="form-label" for="pStock">Stock</label>
                <input id="pStock" type="number" min="0"
                  class="form-control" placeholder="0" />
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label" for="pCategoria">Categoría</label>
              <select id="pCategoria" class="form-select">
                <option value="">Seleccionar…</option>
                <option>Móviles</option>
                <option>Laptops</option>
                <option>Audio</option>
                <option>Gaming</option>
                <option>Wearables</option>
                <option>Accesorios</option>
              </select>
            </div>

            <div class="mb-4">
              <label class="form-label" for="pImagen">Imagen (ruta o URL)</label>
              <input id="pImagen" class="form-control" placeholder="img/producto.jpg" />
            </div>

            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary" id="btnGuardar">
                <i class="bi bi-check-lg me-1"></i>Guardar producto
              </button>
              <button type="button" class="btn btn-soft d-none" id="btnCancelar">
                Cancelar edición
              </button>
            </div>

          </form>

          <!-- Mensaje de respuesta -->
          <p id="mensajeForm" class="mt-3 text-center small fw-semibold"></p>

        </div>
      </div>

      <!-- ── TABLA DE PRODUCTOS ─────────────────────────── -->
      <div class="col-lg-8">

        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2 class="h5 fw-bold mb-0">Productos registrados</h2>
          <span id="totalProductos" class="text-secondary small"></span>
        </div>

        <div class="card border-0 shadow-soft overflow-hidden">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th>#</th>
                  <th>Nombre</th>
                  <th>Categoría</th>
                  <th class="text-end">Precio</th>
                  <th class="text-center">Stock</th>
                  <th class="text-center">Acciones</th>
                </tr>
              </thead>
              <tbody id="tablaProductos">
                <tr>
                  <td colspan="6" class="text-center text-secondary py-4">
                    <i class="bi bi-arrow-repeat me-2"></i>Cargando productos…
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="js/productos.js"></script>
</body>
</html>
